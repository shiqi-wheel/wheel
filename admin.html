<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拾柒转盘口令总控</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
body { min-height: 100vh; background: linear-gradient(160deg,#2b0b10,#59121b 45%,#1f070b); color: #fff8e1; padding: 18px; }
.box { max-width: 780px; margin: 0 auto; }
h1 { text-align:center; font-size:22px; margin:12px 0 4px; }
.sub { text-align:center; color:#ffcc80; font-size:13px; margin-bottom:18px; }
.panel { background:rgba(0,0,0,.24); border:1px solid rgba(255,214,145,.25); border-radius:14px; padding:16px; }
.row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
input, select { border:1px solid rgba(255,224,130,.45); background:rgba(0,0,0,.28); color:#fff8e1; border-radius:10px; padding:10px 12px; font-size:14px; outline:none; }
input:focus { border-color:#ffe082; }
.pwd { flex:1; min-width:220px; }
button { border:0; border-radius:10px; padding:10px 14px; font-weight:700; background:linear-gradient(135deg,#ffd54f,#ff7043); color:#4a1000; cursor:pointer; }
button.ghost { background:rgba(255,224,130,.14); color:#ffe082; }
button.mini { padding:6px 9px; font-size:12px; border-radius:8px; }
button:active { transform:scale(.97); }
.msg { margin-top:10px; color:#ffe082; font-size:13px; min-height:18px; }
.hidden { display:none; }
.tools { margin-top:16px; padding-top:14px; border-top:1px solid rgba(255,224,130,.16); }
.list { margin-top:12px; display:grid; gap:10px; }
.card { background:rgba(0,0,0,.22); border:1px solid rgba(255,224,130,.16); border-radius:12px; padding:12px; }
.token { font-weight:800; color:#ffe082; word-break:all; }
.meta { margin-top:7px; font-size:12px; color:#ffcc80; line-height:1.6; }
.badge { display:inline-block; margin-left:6px; padding:2px 7px; border-radius:999px; font-size:11px; background:rgba(255,224,130,.16); color:#ffe082; }
.used { background:rgba(120,120,120,.28); color:#d7d7d7; }
.disabled { background:rgba(183,28,28,.25); color:#ffcdd2; }
.actions { margin-top:9px; display:flex; gap:6px; flex-wrap:wrap; }
.empty { text-align:center; color:#ffcc80; padding:26px 0; font-size:14px; }
.copy-box { display:none; margin-top:12px; padding:12px; border:1px solid rgba(255,224,130,.32); border-radius:12px; background:rgba(0,0,0,.30); }
.copy-box.show { display:block; }
.copy-title { font-size:13px; color:#ffe082; font-weight:800; margin-bottom:8px; }
.copy-value { width:100%; min-height:96px; border:1px solid rgba(255,224,130,.45); border-radius:10px; background:rgba(0,0,0,.35); color:#fff8e1; padding:10px; font-size:13px; line-height:1.5; resize:vertical; }
.copy-note { margin-top:7px; font-size:12px; color:#ffcc80; line-height:1.6; }
.manual { margin-top:16px; font-size:13px; line-height:1.8; color:#ffe0b2; }
.manual b { color:#ffe082; }
@media(max-width:600px){ body{padding:12px} .panel{padding:12px} input.pwd{min-width:100%} }
</style>
</head>
<body>
<div class="box">
  <h1>拾柒转盘口令总控</h1>
  <div class="sub">口令全局一次有效 · 由云端 tokens.json 记录</div>
  <div class="panel" id="loginPanel">
    <div class="row"><input class="pwd" id="password" type="password" placeholder="输入管理密码"><button id="loginBtn">进入总控</button></div>
    <div class="msg" id="loginMsg"></div>
  </div>
  <div class="panel hidden" id="mainPanel">
    <div class="row"><input id="remark" placeholder="备注 / 给谁（可不填）"><input id="count" type="number" min="1" max="20" value="1" style="width:78px"><button id="createBtn">生成口令</button><button class="ghost" id="refreshBtn">刷新</button></div>
    <div class="msg" id="msg"></div>
    <div class="tools">
      <div class="row"><button class="ghost mini" id="copyLastBtn">复制最后一次生成</button><button class="ghost mini" id="logoutBtn">退出</button></div>
      <div class="list" id="list"></div>
    </div>
    <div class="copy-box" id="copyBox">
      <div class="copy-title" id="copyTitle">复制内容</div>
      <textarea class="copy-value" id="copyValue" readonly></textarea>
      <div class="row" style="margin-top:8px"><button class="mini" id="selectCopyBtn">全选内容</button><button class="ghost mini" id="closeCopyBtn">关闭</button></div>
      <div class="copy-note">如果按钮复制仍没反应，请点“全选内容”后长按文本，在系统菜单里点“复制”。</div>
    </div>
    <div class="manual">
      <div><b>发新机会：</b>生成口令 → 复制一次性链接 → 微信发给对方。</div>
      <div><b>一次性规则：</b>真抽奖后立即全局作废；刷新、换手机、清缓存也不能再用。</div>
      <div><b>停用：</b>还没用时点“停用”，对方将不能抽。</div>
      <div><b>重置：</b>把已用/停用口令恢复为未用，相当于重新发一次机会。</div>
    </div>
  </div>
</div>
<script>
const API_BASE = 'https://shiqi-wheel-web-cplglfykfg.cn-shanghai.fcapp.run';
const PAGE_URL = 'https://shiqi-wheel.github.io/wheel/index.html';
const STORE_KEY = 'shiqi_wheel_admin_password';
let adminPassword = '';
let lastCreated = [];
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(v){ return v ? v.replace('T',' ').replace(/\..+/,'') : ''; }
function msg(t){ $('msg').textContent = t || ''; }
async function api(action, data={}) {
  const res = await fetch(API_BASE + '/api/admin', { method:'POST', headers:{'Content-Type':'application/json','x-admin-password':adminPassword}, body:JSON.stringify({action,...data,password:adminPassword}) });
  const out = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(out.error || ('HTTP ' + res.status));
  return out;
}
async function login(save=true) {
  const v = $('password').value.trim();
  if (!v) { $('loginMsg').textContent='请输入管理密码'; return; }
  adminPassword = v;
  try {
    await api('list');
    if (save) localStorage.setItem(STORE_KEY, v);
    $('loginPanel').classList.add('hidden'); $('mainPanel').classList.remove('hidden');
    await refresh();
  } catch(e) {
    adminPassword=''; localStorage.removeItem(STORE_KEY);
    $('loginMsg').textContent = e.message==='admin_password_error' ? '管理密码不对' : ('登录失败：'+e.message);
  }
}
async function refresh() {
  msg('加载中...');
  try { const d=await api('list'); render(d.tokens||[]); msg(''); }
  catch(e){ msg('加载失败：'+e.message); }
}
function link(token){ return PAGE_URL + '?t=' + encodeURIComponent(token); }
function render(list) {
  $('list').innerHTML = list.length ? list.map(t=>`
    <div class="card">
      <div class="token">${esc(t.token)}${t.used?'<span class="badge used">已使用</span>':''}${t.disabled?'<span class="badge disabled">已停用</span>':''}${!t.used&&!t.disabled?'<span class="badge">未使用</span>':''}</div>
      <div class="meta">备注：${esc(t.remark||'—')}<br>创建：${esc(fmt(t.createdAt))}${t.usedAt?' · 使用：'+esc(fmt(t.usedAt)):''}${t.prize?' · 结果：'+esc(t.prize):''}${t.usedBy?' · 使用者：'+esc(t.usedBy):''}</div>
      <div class="actions">
        <button class="mini" data-copy="${esc(link(t.token))}">复制链接</button>
        <button class="mini" data-copy="${esc(t.token)}">复制口令</button>
        ${t.disabled?'<button class="ghost mini" data-op="enable">启用</button>':'<button class="ghost mini" data-op="disable">停用</button>'}
        ${t.used?'<button class="ghost mini" data-op="reset">重置未用</button>':''}
        <button class="ghost mini" data-op="delete">删除</button>
      </div>
    </div>`).join('') : '<div class="empty">还没有口令，先生成一个</div>';
}
async function create() {
  msg('生成中...');
  try {
    const d=await api('create',{count:+$('count').value||1,remark:$('remark').value});
    lastCreated=d.tokens||[]; await refresh();
    const links=lastCreated.map(x=>link(x.token)).join('\n');
    await copy(links,'已复制 '+lastCreated.length+' 个链接');
  } catch(e){ msg('生成失败：'+e.message); }
}
function showCopyBox(text, title) {
  $('copyTitle').textContent = title || '复制内容';
  $('copyValue').value = text;
  $('copyBox').classList.add('show');
  $('copyBox').scrollIntoView({block:'center',behavior:'smooth'});
  setTimeout(() => { try { const ta=$('copyValue'); ta.focus({preventScroll:true}); ta.setSelectionRange(0, ta.value.length); } catch(e){} }, 0);
}
function selectCopyValue() {
  const ta=$('copyValue'); ta.focus({preventScroll:true}); ta.setSelectionRange(0, ta.value.length);
  try { document.execCommand('selectAll'); } catch(e){}
}
async function copy(text, ok) {
  showCopyBox(text, ok || '复制内容');
  let copied=false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      copied=true;
    }
  } catch(e) { copied=false; }
  if (!copied) {
    selectCopyValue();
    try { copied=document.execCommand('copy'); } catch(e) { copied=false; }
  }
  msg(copied ? (ok || '已复制') : '自动复制失败：请长按上方文本手动复制');
}
async function op(token, op) {
  const names={disable:'停用',enable:'启用',reset:'重置',delete:'删除'};
  if(!confirm('确认'+names[op]+' '+token+'？')) return;
  try{ await api('update',{token,op}); await refresh(); }
  catch(e){ msg('操作失败：'+e.message); }
}
$('loginBtn').onclick=()=>login();
$('password').onkeydown=e=>{if(e.key==='Enter')login()};
$('createBtn').onclick=create;
$('refreshBtn').onclick=refresh;
$('logoutBtn').onclick=()=>{localStorage.removeItem(STORE_KEY);location.reload()};
$('selectCopyBtn').onclick=selectCopyValue;
$('copyValue').onclick=selectCopyValue;
$('closeCopyBtn').onclick=()=>{ $('copyBox').classList.remove('show'); };
$('copyLastBtn').onclick=()=>{ if(!lastCreated.length){msg('还没有新生成的口令');return;} copy(lastCreated.map(x=>link(x.token)).join('\n'),'已复制最后一次生成链接'); };
$('list').onclick=e=>{ const b=e.target.closest('button'); if(!b)return; if(b.dataset.copy)copy(b.dataset.copy); if(b.dataset.op){const token=b.closest('.card').querySelector('.token').childNodes[0].textContent.trim();op(token,b.dataset.op);} };
(function(){
  const saved=localStorage.getItem(STORE_KEY);
  if(saved){$('password').value=saved;login(false);}
})();
</script>
</body>
</html>
