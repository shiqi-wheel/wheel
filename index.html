<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>拾柒的幸运大转盘</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #2a0505;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
    overscroll-behavior: none;
    overflow: hidden;
  }
  .page {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
  }
  h1 {
    font-size: 24px; font-weight: 800; letter-spacing: 5px; text-indent: 5px;
    background: linear-gradient(180deg, #fff7d6 15%, #ffd54f 55%, #ffb300 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,.5));
  }
  .subtitle { margin-top: -14px; font-size: 13px; opacity: .75; letter-spacing: 3px; }
  .wheel-wrap {
    position: relative;
    width: min(88vw, 360px);
    aspect-ratio: 1;
    filter: drop-shadow(0 14px 34px rgba(0,0,0,.68)) drop-shadow(0 0 36px rgba(255,170,40,.38));
  }
  canvas.wheel { width: 100%; height: 100%; display: block; border-radius: 50%; }
  .pointer {
    position: absolute; top: -16px; left: 50%;
    transform: translateX(-50%); z-index: 5;
    width: 44px; height: 58px;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,.45));
  }
  .spin-btn {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 4;
    width: 31%; aspect-ratio: 1;
    border: none; border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #fff2c4 0%, #ffd54f 38%, #ff9800 100%);
    color: #7a2a00;
    font-size: clamp(16px, 5.4vw, 22px); font-weight: 900; letter-spacing: 3px;
    box-shadow: 0 6px 18px rgba(0,0,0,.4), inset 0 -5px 12px rgba(150,40,0,.35), inset 0 4px 8px rgba(255,255,255,.65);
    cursor: pointer;
    transition: transform .12s ease;
    touch-action: manipulation;
  }
  .spin-btn:active { transform: translate(-50%, -50%) scale(.92); }
  .spin-btn[disabled] {
    filter: grayscale(.55) brightness(.8);
    pointer-events: none;
  }
  .tip { font-size: 12px; opacity: .55; letter-spacing: 1px; }
  .chances { font-size: 14px; color: #ffe082; letter-spacing: 2px; min-height: 20px; }

  .modal-mask {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(20, 0, 0, .62);
    backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 28px;
    opacity: 0; pointer-events: none;
    transition: opacity .28s ease;
  }
  .modal-mask.show { opacity: 1; pointer-events: auto; }
  .modal {
    width: min(84vw, 340px);
    background: linear-gradient(180deg, #fff8e1, #ffe0b2);
    border-radius: 22px;
    border: 3px solid #ffb300;
    padding: 30px 24px 26px;
    text-align: center;
    transform: translateY(24px) scale(.92);
    transition: transform .28s cubic-bezier(.2, 1.4, .4, 1);
  }
  .modal-mask.show .modal { transform: none; }
  .modal .label { font-size: 15px; color: #a05200; letter-spacing: 5px; }
  .modal .prize {
    margin: 14px 0 6px;
    font-size: 34px; font-weight: 900; color: #d84315;
    text-shadow: 0 1px 0 #fff;
  }
  .modal .desc {
    font-size: 15px; font-weight: 800; color: #5d4037; line-height: 1.55;
    margin-bottom: 24px; white-space: pre-wrap; word-break: break-word;
    max-height: min(48vh, 360px); overflow-y: auto; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch; padding-right: 4px;
  }
  .modal button {
    width: 100%; padding: 13px 0;
    border: none; border-radius: 999px;
    background: linear-gradient(180deg, #ff7043, #e53935);
    color: #fff; font-size: 17px; font-weight: 700; letter-spacing: 4px;
    box-shadow: 0 6px 16px rgba(211, 47, 47, .45);
    cursor: pointer;
  }
  .modal button:active { transform: scale(.97); }

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, a0, a1);
    ctx.closePath();
    ctx.fillStyle = COLORS[i % COLORS.length];
    ctx.fill();
    ctx.strokeStyle = 'rgba(93,16,16,.9)';
    ctx.lineWidth = 2;
    ctx.stroke();

    const mid = ((i + 0.5) * SEG - 90) * Math.PI / 180;
    ctx.save();
    if (N > 36) {
      // 任务盘/惩罚盘扇区很窄：数字沿半径方向绘制，避免 1-100 标签互相叠死。
      ctx.rotate(mid);
      const smallSize = Math.max(5, Math.min(9, w * 0.021));
      ctx.font = font(smallSize);
      ctx.fillStyle = (i % 2 === 0) ? '#7a1f00' : '#ffffff';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(PRIZES[i].name, r - 20, 0);
      ctx.restore();
      continue;
    }
    ctx.rotate(mid + Math.PI / 2);
    let size = Math.max(12, w * 0.055);
    ctx.font = font(size);
    while (ctx.measureText(PRIZES[i].name).width > r * 0.62 && size > 9) {
      size -= 1;
      ctx.font = font(size);
    }
    ctx.fillStyle = (i % 2 === 0) ? '#7a1f00' : '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(PRIZES[i].name, 0, -r * 0.68);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(0, 0, w * 0.19, 0, Math.PI * 2);
  ctx.fillStyle = '#fff8e1';
  ctx.fill();
  ctx.restore();

  const bulbs = 16;
  for (let i = 0; i < bulbs; i++) {
    const a = (i / bulbs) * Math.PI * 2;
    const x = c + Math.cos(a) * (R - 7);
    const y = c + Math.sin(a) * (R - 7);
    const on = spinning ? ((i + Math.floor(t / 110)) % 2 === 0) : (i % 2 === 0);
    ctx.beginPath();
    ctx.arc(x, y, 4.5, 0, Math.PI * 2);
    ctx.fillStyle = on ? '#fff59d' : 'rgba(255,243,157,.28)';
    if (on) { ctx.shadowColor = '#ffe082'; ctx.shadowBlur = 8; } else { ctx.shadowBlur = 0; }
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function pickWinner() {
  const pool = PRIZES.map((p, i) => ({ i, w: p.weight })).filter(o => o.w > 0);
  const total = pool.reduce((s, o) => s + o.w, 0);
  let r = Math.random() * total;
  for (const o of pool) { r -= o.w; if (r < 0) return o.i; }
  return pool[pool.length - 1].i;
}

/* ---------- 云端一次性口令：一个口令 = 全局一次抽奖 ----------
   管理员在 admin.html 生成口令链接；FC 端全局作废。 */
const API_BASE = 'https://shiqi-wheel-web-cplglfykfg.cn-shanghai.fcapp.run';
const URL_TOKEN = QUERY_PARAMS.get('t') || ''; /* FC will replace this line for ?t= links downloaded as local HTML. */
const CLIENT_ID_KEY = 'shiqi_wheel_cloud_client_id';
document.querySelector('.page h1').textContent = WHEEL_CONFIG[WHEEL_TYPE].title;
document.querySelector('.subtitle').textContent = WHEEL_CONFIG[WHEEL_TYPE].subtitle;
document.title = WHEEL_CONFIG[WHEEL_TYPE].title;
let unlocked = false;
let spinningRequest = false;

function extractToken(value) {
  let text = String(value || '').trim();
  try {
    if (/^https?:\/\//i.test(text)) {
      const fromUrl = new URL(text).searchParams.get('t') || '';
      if (fromUrl) return fromUrl.trim();
    }
  } catch (e) {}
  const matched = text.match(/[?&]t=([^&\s]+)/i);
  if (matched) {
    try { return decodeURIComponent(matched[1]); } catch (e) { return matched[1]; }
  }
  return text;
}
function getClientId() {
  let id = '';
  try { id = localStorage.getItem(CLIENT_ID_KEY) || ''; } catch (e) {}
  if (!id) {
    id = 'c-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    try { localStorage.setItem(CLIENT_ID_KEY, id); } catch (e) {}
  }
  return id;
}
function lockWheel(message) {
  unlocked = false;
  spinningRequest = false;
  spinBtn.disabled = false;
  spinBtn.textContent = '开始抽奖';
  const area = document.getElementById('unlockArea');
  if (area) area.style.display = '';
  const tipEl = document.getElementById('unlockTip');
  if (tipEl) tipEl.textContent = message || '';
  document.querySelector('.tip').textContent = '一次性口令由主人发放 · 用完即作废';
}
async function tryUnlock() {
  const input = document.getElementById('pwdInput');
  const tip = document.getElementById('unlockTip');
  const token = extractToken(input.value || '');
  if (!token) { tip.textContent = '请输入一次性口令'; return; }
  if (spinningRequest || spinning) return;
  spinningRequest = true;
  spinBtn.disabled = true;
  spinBtn.textContent = '验证中';
  tip.textContent = '';
  try {
    const res = await fetch(API_BASE + '/api/draw', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, clientId: getClientId() })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const msg = data.message || (data.error === 'token_used' ? '这个口令已经用过啦' : data.error === 'token_disabled' ? '这个口令已停用' : '口令无效或服务暂不可用');
      lockWheel(msg);
      return;
    }
    unlocked = true;
    document.getElementById('unlockArea').style.display = 'none';
    spin(data.prizeIndex);
  } catch (e) {
    lockWheel('网络失败，稍后再试');
  }
}
document.getElementById('unlockBtn').addEventListener('click', tryUnlock);
document.getElementById('pwdInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(); });
if (URL_TOKEN) document.getElementById('pwdInput').value = URL_TOKEN;
lockWheel();

async function spin(target) {
  if (spinning || !unlocked || typeof target !== 'number') return;
  spinning = true;
  spinningRequest = false;
  spinBtn.disabled = true;
  spinBtn.textContent = '···';
  const targetRot = ((360 - (target * SEG + SEG / 2)) % 360 + 360) % 360;
  const current = ((rotation % 360) + 360) % 360;
  const delta = ((targetRot - current) % 360 + 360) % 360;
  const total = TURNS * 360 + delta + Math.random() * SEG * 0.5;
  const from = rotation;
  const to = rotation + total;
  const t0 = performance.now();
  (function frame(now) {
    const p = Math.min(1, (now - t0) / SPIN_MS);
    const ease = 1 - Math.pow(1 - p, 4);
    rotation = from + (to - from) * ease;
    drawWheel(now);
    if (p < 1) { requestAnimationFrame(frame); }
    else {
      spinning = false;
      if (navigator.vibrate) { try { navigator.vibrate(80); } catch (e) {} }
      showResult(target);
    }
  })(t0);
}

function showResult(i) {
  document.title = WHEEL_CONFIG[WHEEL_TYPE].title;
  document.querySelector('.page h1').textContent = WHEEL_CONFIG[WHEEL_TYPE].title;
  document.querySelector('.subtitle').textContent = WHEEL_CONFIG[WHEEL_TYPE].subtitle;
  document.getElementById('prizeName').textContent = PRIZES[i].name;
  const descEl = document.getElementById('prizeDesc');
  descEl.textContent = PRIZES[i].desc || '';
  descEl.scrollTop = 0;
  addHistory(PRIZES[i]);
  mask.classList.add('show');
  confetti();
}
function renderChances() { chancesEl.textContent = '一次性口令 · 全局一次有效'; }
document.getElementById('closeBtn').addEventListener('click', () => {
  mask.classList.remove('show');
  lockWheel();
});
spinBtn.addEventListener('click', tryUnlock);
window.addEventListener('resize', sizeCanvas);
sizeCanvas();
renderChances();

/* ---------- 中奖记录（存在本机浏览器，最多保留 100 条） ---------- */
const HISTORY_KEY = 'shiqi_wheel_history';

function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; }
  catch (e) { return []; }
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtTime(ts) {
  const d = new Date(ts), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function addHistory(prize) {
  try {
    const list = getHistory();
    list.unshift({ name: prize.name, desc: prize.desc || '', time: Date.now() });
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 100)));
  } catch (e) {}
}
function renderHistory() {
  const list = getHistory();
  const box = document.getElementById('historyList');
  const count = document.getElementById('historyCount');
  count.textContent = list.length ? `共 ${list.length} 条` : '';
  if (!list.length) {
    box.innerHTML = '<div class="history-empty">还没有记录，转一次试试吧</div>';
    return;
  }
  box.innerHTML = list.map(h =>
    `<div class="history-item"><span class="h-name">${escapeHtml(h.name)}</span><span class="h-time">${fmtTime(h.time)}</span></div>`
  ).join('');
}
const historyMask = document.getElementById('historyMask');
document.getElementById('historyBtn').addEventListener('click', () => {
  renderHistory();
  historyMask.classList.add('show');
});
document.getElementById('histClose').addEventListener('click', () => historyMask.classList.remove('show'));
historyMask.addEventListener('click', e => { if (e.target === historyMask) historyMask.classList.remove('show'); });
document.getElementById('histClear').addEventListener('click', () => {
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
});
/* ---------- 彩带 ---------- */
const fx = document.getElementById('fx');
const fctx = fx.getContext('2d');
let pieces = [], fxRun = false;

function confetti() {
  fx.width = innerWidth * DPR();
  fx.height = innerHeight * DPR();
  fctx.setTransform(DPR(), 0, 0, DPR(), 0, 0);
  const colors = ['#ffd54f', '#ef5350', '#4fc3f7', '#81c784', '#ffffff', '#ff8a65'];
  for (let i = 0; i < 130; i++) {
    pieces.push({
      x: innerWidth / 2 + (Math.random() - .5) * 60,
      y: innerHeight * .38,
      vx: (Math.random() - .5) * 11,
      vy: -Math.random() * 12 - 4,
      s: Math.random() * 6 + 3,
      c: colors[i % colors.length],
      rot: Math.random() * Math.PI,
      vr: (Math.random() - .5) * .3,
    });
  }
  if (!fxRun) { fxRun = true; requestAnimationFrame(fxFrame); }
}

function fxFrame() {
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  pieces = pieces.filter(p => p.y < innerHeight + 30);
  for (const p of pieces) {
    p.vy += .32; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    fctx.save();
    fctx.translate(p.x, p.y);
    fctx.rotate(p.rot);
    fctx.fillStyle = p.c;
    fctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s * .6);
    fctx.restore();
  }
  if (pieces.length) requestAnimationFrame(fxFrame);
  else { fxRun = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
}
